[project]
name = "sql-query-optimizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "mysql-connector-python",
    "sqlglot",
    "pulp>=3,<4",  # 4.x no longer bundles the CBC binary the stack calls for (4.x: pulp[cbc] + COIN_CMD)
    "simpy",
    "numpy",
    "scipy",  # Wilcoxon signed-rank test: exact small-sample p-values are not in NumPy and are easy to get wrong by hand
    "pyyaml",
    "httpx",  # HTTP client for Ollama/Groq (was dev-only, for FastAPI TestClient)
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
