# AHP judgments for the OR engine's criteria. FIXED BEFORE ANY EVALUATION RUN
# (CLAUDE.md rule 5): never tune these on the evaluation queries. Written
# 2026-10-27, before any candidate was measured, from a priori reasoning only.
#
# All four criteria are costs (lower is better). Each is measured per
# candidate by app/optimizer/metrics.py and shown identically to arm 2b.
#
#   runtime_ms     median wall-clock of the timed runs (what users feel; ground-truth-like)
#   rows_examined  rows MySQL actually read (measured work; stable across noisy runs)
#   est_cost       optimizer's EXPLAIN query_cost (a model output; correlated with the baseline's own choice)
#   est_rows       optimizer's estimated rows examined (a model output; weakest, coarsest)
#
# Judgment: runtime matters most; measured work next; the optimizer's own
# estimates least, because the baseline arm already trusts them and an engine
# that merely repeats them adds nothing. Scale is Saaty 1-9.
# The consistency ratio is computed on load and must be < 0.1 (tests assert it).
criteria: [runtime_ms, rows_examined, est_cost, est_rows]
direction:
  runtime_ms: cost
  rows_examined: cost
  est_cost: cost
  est_rows: cost
pairwise:        # [a, b, v] = "a is v times as important as b"
  - [runtime_ms, rows_examined, 3]
  - [runtime_ms, est_cost, 5]
  - [runtime_ms, est_rows, 7]
  - [rows_examined, est_cost, 2]
  - [rows_examined, est_rows, 3]
  - [est_cost, est_rows, 2]

# Declared secondary arm "3-measured" (written 2026-10-27, AFTER the clean dev run dev-003 and BEFORE any test run).
# The same judgments above, restricted to the two criteria that are MEASURED on this server: with only
# runtime:rows_examined = 3 left, the weights are 0.75 / 0.25 (CR = 0). Motivation: on dev-003 the two EXPLAIN
# estimate criteria outvoted runtime on queries where the optimizer misprices derived-table plans
# (docs/threats_to_validity.md items 32-33). Nothing is re-tuned; the primary arm 3 uses all four criteria,
# unchanged. Both are reported. The choice of THIS variant was informed by dev data, so it is a declared
# post-dev secondary arm, not an a-priori one.
variants:
  measured: [runtime_ms, rows_examined]
