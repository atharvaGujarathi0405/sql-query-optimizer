# Execution settings shared by every arm. Fixed before any evaluation run.
#
# query_timeout_s: per-query wall-clock cap, applied via MySQL max_execution_time
# to every query the read-only user runs (original and candidates alike).
#
# Why 120: in the single-run feasibility check (scripts/validate_queries.py, 120 s
# cap, 2026-10-27) all 40 baseline queries finished; the slowest was TPC-H Q1 at
# 20.8 s, most took under 1 s, and none timed out at baseline (Q17: 0.5 s,
# Q18: 3.6 s, contrary to the expectation that they might). 120 s is ~6x the
# slowest baseline: a candidate that cannot finish in that time is
# pathologically worse than anything in the registry, yet one timeout costs at
# most 2 minutes. Not tuned on arm performance.
#
# A timeout is its own outcome ("timeout"), never a runtime: results record
# outcome=timeout with runtime=null, and reports count timeouts separately
# (right-censored), not as 120 s. After a candidate's first timeout the runner
# skips its remaining repeats (outcome recorded once per candidate).
query_timeout_s: 120

# Timing protocol (CLAUDE.md rule 7), identical for every query and every arm:
# warmup runs are discarded, then timed runs are summarised as median and IQR.
warmup_runs: 2
timed_runs: 5

# Candidate pool size requested from the generator (the cap on candidates kept per query).
candidates_per_query: 5

# --- Evaluation harness (Phase 3). Fixed before any evaluation run.
# Repeats per query for the LLM arms (2a, 2b); fairness rule 6 asks for >= 5.
llm_repeats: 5
# A pick counts as a win/loss against the baseline only if its median runtime differs from the
# baseline's by more than max(baseline IQR, tie_band_pct % of baseline median); otherwise a tie.
tie_band_pct: 5
# OR-engine noise guard (see optimizer/decision.py): keep the original unless the TOPSIS winner
# beats it by more than this many baseline IQRs. 0 disables. The raw TOPSIS pick is always recorded
# as arm "3-raw" so the guard can be judged on the dev set from the same measurements.
or_noise_guard_iqr_multiple: 1.0
