services:
  mysql:
    image: mysql:8.4.13  # pinned: MySQL version must be recorded with results
    restart: unless-stopped
    # Server config shared by every arm (fairness rule 7). Passed as flags, not a
    # mounted my.cnf: Windows bind mounts are world-writable and MySQL silently
    # ignores such config files. Change only before an evaluation run, and
    # record the change with the run. Verified live by scripts/check_counts.py.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=2G  # all 3 datasets measure 1.71 GiB (TPC-H 1.56) after load: fits with ~14% headroom, residency not verified
      # Sakila/Employees triggers and functions need SUPER unless the binlog is off. No replication here.
      # local_infile stays at its default (OFF); scripts/load_data.py enables it only around the TPC-H load.
      - --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set in .env}
      DATASET_SCHEMAS: ${DATASET_SCHEMAS:?set in .env}
      OPTIMIZER_ADMIN_USER: ${OPTIMIZER_ADMIN_USER:?set in .env}
      OPTIMIZER_ADMIN_PASSWORD: ${OPTIMIZER_ADMIN_PASSWORD:?set in .env}
      OPTIMIZER_READONLY_USER: ${OPTIMIZER_READONLY_USER:?set in .env}
      OPTIMIZER_READONLY_PASSWORD: ${OPTIMIZER_READONLY_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./data/raw:/seed:ro  # downloaded/generated dataset files, see scripts/fetch_data.py
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql_data:
